<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Timeblock">
  <title>Timeblock</title>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1f2937" flood-opacity=".14"/>
    </filter>
    <filter id="clockShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1f2937" flood-opacity=".16"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbfaf7"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8bcf2"/>
      <stop offset="1" stop-color="#b7aae9"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7c9f4"/>
      <stop offset="1" stop-color="#aabdec"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cce5bf"/>
      <stop offset="1" stop-color="#b9d9ae"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8dda0"/>
      <stop offset="1" stop-color="#f0ca78"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="112" y="100" width="800" height="824" rx="176" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Timeline -->
  <rect x="292" y="196" width="18" height="650" rx="9" fill="#d8d8da"/>
  <g fill="#c9cacc">
    <rect x="178" y="260" width="96" height="25" rx="13"/>
    <rect x="178" y="406" width="96" height="25" rx="13"/>
    <rect x="178" y="552" width="96" height="25" rx="13"/>
    <rect x="178" y="698" width="96" height="25" rx="13"/>
  </g>

  <!-- Time blocks -->
  <rect x="438" y="180" width="400" height="118" rx="34" fill="url(#purple)"/>
  <rect x="322" y="310" width="286" height="84" rx="31" fill="url(#blue)"/>
  <rect x="322" y="404" width="516" height="166" rx="31" fill="url(#green)"/>
  <rect x="322" y="582" width="324" height="98" rx="31" fill="url(#purple)"/>
  <rect x="322" y="690" width="346" height="138" rx="31" fill="url(#yellow)"/>

  <!-- Clock -->
  <circle cx="724" cy="652" r="169" fill="#ffffff" filter="url(#clockShadow)"/>
  <circle cx="724" cy="652" r="169" fill="#fff" opacity=".96"/>
  <g stroke="#34363b" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <path d="M724 652 L724 556"/>
    <path d="M724 652 L805 706"/>
  </g>
  <circle cx="724" cy="652" r="16" fill="#34363b"/>
</svg>
