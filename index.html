<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f0e8" />
    <meta name="description" content="Timeblock：划选时间，快速安排每天和周末。" />
    <title>Timeblock · 快速安排时间</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="icon-library" aria-hidden="true">
      <symbol id="icon-timeline" viewBox="0 0 24 24"><path d="M6 3v3M18 3v3M4 9h16M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/><path d="M8 13h3v3H8zM14 13h2"/></symbol>
      <symbol id="icon-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></symbol>
      <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="icon-select-time" viewBox="0 0 24 24"><path d="M5 5h14M5 19h14M12 8v8M9 11l3-3 3 3M9 13l3 3 3-3"/></symbol>
    </svg>

    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#today" aria-label="Timeblock 首页">
          <span class="brand-mark"><span></span><span></span><span></span></span>
        </a>

        <nav class="main-nav" aria-label="主导航">
          <button class="nav-item active" data-view="today" aria-label="日程">
            <svg><use href="#icon-timeline"></use></svg>
          </button>
          <button class="nav-item" data-view="recurring" aria-label="重复日程">
            <svg><use href="#icon-repeat"></use></svg>
            <span class="nav-count" id="ruleCount">2</span>
          </button>
        </nav>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="date-navigation">
            <button class="icon-button range-button previous" id="previousRangeButton" aria-label="上一日期范围"><svg><use href="#icon-chevron"></use></svg></button>
            <p class="eyebrow" id="dateEyebrow"></p>
            <button class="icon-button range-button" id="nextRangeButton" aria-label="下一日期范围"><svg><use href="#icon-chevron"></use></svg></button>
          </div>
          <h1 class="sr-only" id="viewTitle">日程</h1>
          <div class="topbar-actions">
            <div class="view-range-control" aria-label="时间轴显示范围">
              <button data-view-days="1" aria-label="显示一天">1</button>
              <button data-view-days="3" aria-label="显示三天">3</button>
              <button data-view-days="7" aria-label="显示一周">7</button>
            </div>
            <button class="icon-button topbar-icon today-control" id="todayButton" aria-label="回到今天">今</button>
            <button class="icon-button topbar-icon" id="clearDoneButton" aria-label="清理已完成">
              <svg><use href="#icon-trash"></use></svg>
            </button>
          </div>
        </header>

        <section class="view active" id="todayView" aria-labelledby="viewTitle">
          <div class="planner-layout">
            <section class="timeline-card" aria-label="日程时间轴">
              <div class="card-heading">
                <div class="progress-track" id="scheduleProgress" role="progressbar" aria-label="当前范围已安排比例" aria-valuemin="0" aria-valuemax="100"><span id="progressBar"></span></div>
              </div>

              <div class="timeline-scroll" id="timelineScroll">
                <div class="timeline-headers" id="timelineHeaders"></div>
                <div class="timeline" id="timeline">
                  <div class="time-axis" id="timeAxis"></div>
                  <div class="timeline-days" id="timelineDays"></div>
                </div>
              </div>

              <div class="drag-instruction" id="dragInstruction">
                <span class="drag-icon"><svg><use href="#icon-select-time"></use></svg></span>
                <span>按住空白</span>
              </div>
            </section>

            <aside class="planning-panel">
              <section class="panel-card rhythm-card">
                <div class="panel-heading compact">
                  <svg class="panel-heading-icon" aria-hidden="true"><use href="#icon-repeat"></use></svg>
                  <button class="icon-button" id="manageRulesButton" aria-label="管理重复日程"><svg><use href="#icon-chevron"></use></svg></button>
                </div>
                <div id="tonightRules" class="tonight-rules"></div>
              </section>
            </aside>
          </div>
        </section>

        <section class="view" id="recurringView" aria-labelledby="recurringTitle" hidden>
          <div class="recurring-hero">
            <h2 id="recurringTitle">重复</h2>
            <button class="primary-button icon-only-button" id="newRuleButton" aria-label="新建重复日程"><svg><use href="#icon-plus"></use></svg></button>
          </div>
          <div class="week-strip" id="weekStrip" aria-label="一周概览"></div>
          <div class="rule-list" id="ruleList"></div>
        </section>
      </main>
    </div>

    <nav class="mobile-nav" aria-label="移动端导航">
      <button class="active" data-view="today" aria-label="日程"><svg><use href="#icon-timeline"></use></svg></button>
      <button class="mobile-add" id="mobileAddButton" aria-label="到时间轴划选时间"><svg><use href="#icon-select-time"></use></svg></button>
      <button data-view="recurring" aria-label="重复日程"><svg><use href="#icon-repeat"></use></svg></button>
    </nav>

    <div class="action-picker" id="actionPicker" role="dialog" aria-labelledby="actionPickerTitle" hidden>
      <div class="action-picker-heading">
        <div><span id="selectedRange">19:00 — 19:45</span><strong class="sr-only" id="actionPickerTitle">选择行动</strong></div>
        <button id="closeActionPicker" aria-label="取消选择">×</button>
      </div>
      <div id="contentListView">
        <div class="action-options" id="actionOptions"></div>
        <button class="custom-action" id="newContentButton" aria-label="添加新的事件内容"><svg><use href="#icon-plus"></use></svg></button>
      </div>
      <form class="content-form" id="contentForm" hidden>
        <label class="picker-field">
          <span class="sr-only">事件内容</span>
          <input id="contentTitle" maxlength="40" autocomplete="off" placeholder="事件内容" required />
        </label>
        <label class="picker-field">
          <span class="sr-only">分类，可选</span>
          <input id="contentCategory" list="categoryOptions" maxlength="20" autocomplete="off" placeholder="分类（可选）" />
        </label>
        <label class="favorite-choice"><input id="contentFavorite" type="checkbox" /><span>加入常用</span></label>
        <div class="dialog-error" id="contentError" role="alert"></div>
        <div class="content-form-actions">
          <button type="button" class="secondary-button" id="cancelContentButton">返回</button>
          <button type="submit" class="primary-button">确认</button>
        </div>
      </form>
    </div>

    <datalist id="categoryOptions"></datalist>

    <dialog id="blockDialog" class="sheet-dialog">
      <form method="dialog" id="blockForm">
        <div class="dialog-heading"><div><span class="section-kicker" id="blockDialogKicker">时间块</span><h2 id="blockDialogTitle">编辑安排</h2></div><button class="close-button" value="cancel" aria-label="关闭">×</button></div>
        <input type="hidden" id="blockId" />
        <input type="hidden" id="blockOriginalDate" />
        <label class="field"><span>要做什么</span><input id="blockTitle" required maxlength="40" placeholder="例如：洗澡、阅读、运动" /></label>
        <label class="field"><span>分类（可选）</span><input id="blockCategory" list="categoryOptions" maxlength="20" placeholder="例如：健康" /></label>
        <label class="field"><span>日期</span><input id="blockDate" type="date" required /></label>
        <div class="field-row">
          <label class="field"><span>开始</span><input id="blockStart" inputmode="numeric" pattern="(?:[01]\d|2[0-3]):[0-5]\d" placeholder="00:00" required /></label>
          <label class="field"><span>结束</span><input id="blockEnd" inputmode="numeric" pattern="(?:(?:[01]\d|2[0-3]):[0-5]\d|24:00)" placeholder="24:00" required /></label>
        </div>
        <fieldset class="color-field"><legend>颜色</legend><div class="color-options">
          <label><input type="radio" name="blockColor" value="apricot" checked /><span class="apricot"></span></label>
          <label><input type="radio" name="blockColor" value="sage" /><span class="sage"></span></label>
          <label><input type="radio" name="blockColor" value="blue" /><span class="blue"></span></label>
          <label><input type="radio" name="blockColor" value="lilac" /><span class="lilac"></span></label>
        </div></fieldset>
        <div class="dialog-error" id="blockError" role="alert"></div>
        <div class="dialog-actions"><button type="button" class="delete-button" id="deleteBlockButton"><svg><use href="#icon-trash"></use></svg>删除</button><span></span><button value="cancel" class="secondary-button">取消</button><button type="submit" class="primary-button">保存安排</button></div>
      </form>
    </dialog>

    <dialog id="ruleDialog" class="sheet-dialog">
      <form method="dialog" id="ruleForm">
        <div class="dialog-heading"><div><span class="section-kicker">重复日程</span><h2>新建一个生活节奏</h2></div><button class="close-button" value="cancel" aria-label="关闭">×</button></div>
        <label class="field"><span>日程名称</span><input id="ruleTitle" required maxlength="40" placeholder="例如：晚间运动" /></label>
        <div class="field-row">
          <label class="field"><span>开始时间</span><input id="ruleStart" type="time" value="19:30" required /></label>
          <label class="field"><span>持续时长</span><select id="ruleDuration"><option value="25">25 分钟</option><option value="45" selected>45 分钟</option><option value="60">1 小时</option><option value="90">1.5 小时</option></select></label>
        </div>
        <fieldset class="days-field"><legend>在哪些天重复</legend><div class="day-options" id="dayOptions"></div></fieldset>
        <div class="dialog-error" id="ruleError" role="alert"></div>
        <div class="dialog-actions end"><button value="cancel" class="secondary-button">取消</button><button type="submit" class="primary-button">创建日程</button></div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"><svg><use href="#icon-check"></use></svg><span></span></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
